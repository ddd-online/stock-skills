<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --bg-2: #eef4fb;
      --panel: #ffffff;
      --panel-2: #f8fafc;
      --line: #dbe4ef;
      --text: #172033;
      --muted: #64748b;
      --gold: #b7791f;
      --gold-soft: #fff7e6;
      --red: #dc2626;
      --red-soft: #fff1f2;
      --broken: #64748b;
      --broken-soft: #f1f5f9;
      --green: #0f9f6e;
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 12% -8%, rgba(191, 219, 254, 0.75), transparent 34%),
        radial-gradient(circle at 92% 2%, rgba(254, 240, 138, 0.38), transparent 30%),
        linear-gradient(180deg, #f9fcff, var(--bg-2));
      font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      line-height: 1.5;
    }

    .page {
      width: min(1400px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 22px;
    }

    .hero {
      padding: 20px 24px 18px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: linear-gradient(135deg, #ffffff, #f7fbff);
      box-shadow: 0 8px 28px rgba(37, 63, 99, 0.08);
    }

    .eyebrow {
      color: var(--gold);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .hero-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin-top: 8px;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 3.2vw, 36px);
      line-height: 1.15;
      letter-spacing: -0.03em;
    }

    .data-date {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 13px;
    }

    .subtitle {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .subtitle strong { color: var(--text); font-weight: 600; }

    .summary {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      margin-top: 16px;
    }

    .summary-card {
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      box-shadow: 0 2px 8px rgba(37, 63, 99, 0.04);
    }

    .summary-card .label {
      color: var(--muted);
      font-size: 12px;
    }

    .summary-card .value {
      margin-top: 3px;
      color: var(--text);
      font-size: 21px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .summary-card .value.is-red { color: var(--red); }
    .summary-card .value.is-gold { color: var(--gold); }
    .summary-card .value.is-broken { color: var(--broken); }

    .section-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 18px 2px 9px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 17px;
      letter-spacing: 0.02em;
    }

    .section-title span {
      color: var(--muted);
      font-size: 12px;
    }

    .ladder {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: 0 6px 22px rgba(37, 63, 99, 0.06);
    }

    .ladder-row {
      display: grid;
      grid-template-columns: 70px minmax(0, 1fr);
      gap: 12px;
      padding: 12px 14px;
      border-top: 1px solid var(--line);
    }

    .ladder-row:first-child { border-top: 0; }

    .level {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 4px;
      color: var(--gold);
    }

    .level::after {
      content: "";
      position: absolute;
      top: 58px;
      bottom: -18px;
      width: 1px;
      background: linear-gradient(var(--gold), transparent);
      opacity: 0.42;
    }

    .ladder-row:last-child .level::after { display: none; }

    .level-num {
      font-size: 24px;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .level-label {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(174px, 1fr));
      align-items: stretch;
      gap: 7px;
      min-width: 0;
    }

    .stock-card {
      position: relative;
      min-width: 0;
      padding: 9px 10px 8px;
      border: 1px solid var(--line);
      border-left: 3px solid var(--red);
      border-radius: 9px;
      background: var(--panel);
      box-shadow: 0 1px 3px rgba(37, 63, 99, 0.05);
    }

    .stock-card.is-broken {
      border-style: dashed;
      border-left-style: dashed;
      border-left-color: var(--broken);
      background: var(--panel-2);
    }

    .stock-card.is-broken .card-top { padding-right: 38px; }

    .card-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .stock-name {
      overflow: hidden;
      color: var(--text);
      font-size: 13px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .stock-code {
      flex: 0 0 auto;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 9px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 7px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 18px;
      padding: 1px 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: #f8fafc;
      font-size: 9px;
      line-height: 1.3;
    }

    .tag-board {
      color: #8a5a13;
      border-color: #f1d59b;
      background: var(--gold-soft);
      font-weight: 700;
    }

    .tag-stat {
      color: #315ea8;
      border-color: #c9dcff;
      background: #eef5ff;
    }

    .tag-broken {
      color: #59677a;
      border-color: #cbd5e1;
      background: var(--broken-soft);
    }

    .meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 5px 8px;
      margin: 8px 0 0;
    }

    .meta div {
      min-width: 0;
      padding-top: 5px;
      border-top: 1px solid #edf2f7;
    }

    .meta dt {
      color: var(--muted);
      font-size: 9px;
    }

    .meta dd {
      margin: 2px 0 0;
      color: var(--text);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .broken-stamp {
      position: absolute;
      top: 7px;
      right: 8px;
      padding: 1px 5px;
      color: var(--broken);
      border: 1px dashed rgba(129, 144, 165, 0.6);
      border-radius: 5px;
      font-size: 8px;
      letter-spacing: 0.12em;
    }

    .empty-state {
      padding: 32px 20px;
      color: var(--muted);
      text-align: center;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      margin-top: 12px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--muted);
      background: var(--panel);
      font-size: 11px;
    }

    .legend-item { display: inline-flex; align-items: center; gap: 7px; }

    .legend-mark {
      width: 16px;
      height: 10px;
      border-radius: 3px;
      background: var(--red-soft);
      border-left: 3px solid var(--red);
    }

    .legend-mark.is-broken {
      border: 1px dashed var(--broken);
      border-left: 3px dashed var(--broken);
      background: var(--broken-soft);
    }

    footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px 24px;
      margin-top: 24px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
    }

    footer strong { color: var(--text); font-weight: 600; }

    @media (max-width: 820px) {
      .page { width: min(100% - 20px, 1400px); padding-top: 14px; }
      .hero { padding: 16px 14px 14px; }
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .ladder-row { grid-template-columns: 1fr; gap: 8px; padding: 11px; }
      .level { flex-direction: row; justify-content: flex-start; gap: 6px; }
      .level::after { display: none; }
      .level-num { font-size: 21px; }
      .level-label { margin-top: 0; }
      .cards { grid-template-columns: repeat(auto-fill, minmax(164px, 1fr)); }
    }

    @media (max-width: 460px) {
      .hero-row { align-items: flex-start; flex-direction: column; }
      .summary { grid-template-columns: 1fr 1fr; }
      .summary-card .value { font-size: 18px; }
      .stock-card { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="hero">
      <div class="eyebrow">A股 · 连板天梯</div>
      <div class="hero-row">
        <h1>{{TITLE}}</h1>
        <div class="data-date">数据日期 {{DATA_DATE}}</div>
      </div>
      <div class="subtitle">
        <span>生成时间 <strong>{{GENERATED_AT}}</strong></span>
        <span>口径 <strong>{{DATA_WINDOW}}</strong></span>
      </div>
      <div class="summary">{{SUMMARY_HTML}}</div>
    </header>

    <div class="section-title">
      <h2>连板高度</h2>
      <span>层级按连板数，几天几板仅作标注</span>
    </div>

    <main class="ladder">{{LADDER_HTML}}</main>

    <div class="legend">
      <span class="legend-item"><span class="legend-mark"></span>今日封板</span>
      <span class="legend-item"><span class="legend-mark is-broken"></span>昨日涨停今日断板</span>
      <span>今日卡片：首封时间 + 开盘价</span>
      <span>断板卡片：昨日封板时间 + 今日开盘/收盘价</span>
    </div>

    <footer>
      <span>{{SOURCE_NOTE}}</span>
      <strong>{{DISCLAIMER}}</strong>
    </footer>
  </div>
</body>
</html>
